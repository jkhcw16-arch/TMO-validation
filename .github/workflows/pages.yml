name: TMO Pages

on:
  push:
    branches:
      - main
    paths:
      - "index.html"
      - "docs/**"
      - "PTM-Answer-Accuracy-Improvement-v1.2.1.md"
      - "PTM_TMO_Traceability_With_Validation_Report.xlsx"
      - "TMO-LE-v0.1.0-Final-Release-Report.docx"
      - ".github/workflows/pages.yml"

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "tmo-pages"
  cancel-in-progress: false

jobs:

  build:
    name: Build Pages artifact
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Verify site entry point
        shell: bash
        run: |
          test -f index.html
          echo "index.html found"

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."

  deploy:
    name: Deploy Pages

    needs:
      - build

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
