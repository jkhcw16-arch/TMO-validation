name: TMO Pages

on:
  push:
    branches:
      - main
    paths:
      - "index.html"
      - "site.css"
      - "price.html"
      - "inquiries.html"
      - "privacy.html"
      - "staticwebapp.config.json"
      - "docs/**"
      - "src/profiles/ed/**"
      - "src/profiles/le/**"
      - "src/profiles/ca/**"
      - "PTM-Answer-Accuracy-Improvement-v1.2.1.md"
      - "PTM_TMO_Traceability_With_Validation_Report.xlsx"
      - "TMO-LE-v0.1.0-Final-Release-Report.docx"
      - ".github/workflows/pages.yml"

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "tmo-pages"
  cancel-in-progress: false

jobs:

  build:
    name: Build TMO Pages
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Verify website files
        shell: bash
        run: |
          test -f index.html
          test -f site.css

          echo "TMO homepage found"
          echo "Shared stylesheet found"

          if [ -f price.html ]; then
            echo "Pricing page found"
          fi

          if [ -f inquiries.html ]; then
            echo "Inquiries page found"
          fi

          if [ -f privacy.html ]; then
            echo "Privacy page found"
          fi

      - name: Prepare Pages site
        shell: bash
        run: |
          mkdir -p _site

          cp index.html _site/
          cp site.css _site/

          if [ -f price.html ]; then
            cp price.html _site/
          fi

          if [ -f inquiries.html ]; then
            cp inquiries.html _site/
          fi

          if [ -f privacy.html ]; then
            cp privacy.html _site/
          fi

          if [ -f staticwebapp.config.json ]; then
            cp staticwebapp.config.json _site/
          fi

          if [ -d docs ]; then
            cp -R docs _site/
          fi

          if [ -d src ]; then
            cp -R src _site/
          fi

          if [ -f PTM-Answer-Accuracy-Improvement-v1.2.1.md ]; then
            cp PTM-Answer-Accuracy-Improvement-v1.2.1.md _site/
          fi

          if [ -f PTM_TMO_Traceability_With_Validation_Report.xlsx ]; then
            cp PTM_TMO_Traceability_With_Validation_Report.xlsx _site/
          fi

          if [ -f TMO-LE-v0.1.0-Final-Release-Report.docx ]; then
            cp TMO-LE-v0.1.0-Final-Release-Report.docx _site/
          fi

          echo "TMO Pages site prepared"

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "_site"


  deploy:
    name: Deploy TMO Pages

    needs:
      - build

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
