name: TMO Pages

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'docs/**'
      - 'PTM-Answer-Accuracy-Improvement-v1.2.1.md'
      - 'PTM_TMO_Traceability_With_Validation_Report.xlsx'
      - 'TMO-LE-v0.1.0-Final-Release-Report.docx'
      - '.github/workflows/pages.yml'

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
