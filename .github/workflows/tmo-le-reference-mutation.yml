name: TMO-LE reference mutation gate

on:
  pull_request:
    paths:
      - '.github/workflows/tmo-le-reference-mutation.yml'
      - 'scripts/tmo_release_mutation_gate.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mutation-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CANDIDATE_SHA256: a7aac3ab8333acefd3cc3c1e6180d52d74605bf6ffe6e794137a02732bdbc5ac
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Check out the staged candidate
        uses: actions/checkout@v4
        with:
          ref: a1d2923e9468ec458e9b96db56b6173f1883ffb2
          path: .tmo-le-candidate
          sparse-checkout: release-inputs
          persist-credentials: false

      - name: Verify candidate before reading its dependencies
        shell: bash
        run: |
          candidate=".tmo-le-candidate/release-inputs/TMO-LE-v0.1.0-CANDIDATE.zip"
          printf '%s  %s\n' "$CANDIDATE_SHA256" "$candidate" | sha256sum --check --strict -
          unzip -p "$candidate" requirements-ci.txt > "$RUNNER_TEMP/tmo-le-requirements.txt"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Run mutation gate with pinned dependencies
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/tmo-le-venv"
          venv_python="$RUNNER_TEMP/tmo-le-venv/bin/python"
          "$venv_python" -m pip install --disable-pip-version-check \
            -r "$RUNNER_TEMP/tmo-le-requirements.txt"
          "$venv_python" scripts/tmo_release_mutation_gate.py \
            ".tmo-le-candidate/release-inputs/TMO-LE-v0.1.0-CANDIDATE.zip" \
            --report "$RUNNER_TEMP/TMO-LE-Release-Mutation-Results.json"

      - name: Retain mutation results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: TMO-LE-release-mutation-results
          path: ${{ runner.temp }}/TMO-LE-Release-Mutation-Results.json
          if-no-files-found: ignore
