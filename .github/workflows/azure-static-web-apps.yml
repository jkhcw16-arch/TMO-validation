name: Deploy TMO Validation to Azure Static Web Apps

on:
  push:
    branches:
      - main

  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - closed
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:

  build_and_deploy:
    if: >
      github.event_name != 'pull_request' ||
      github.event.action != 'closed'

    runs-on: ubuntu-latest

    name: Build and Deploy

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy static site
        uses: Azure/static-web-apps-deploy@v1

        with:
          azure_static_web_apps_api_token:
            ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}

          repo_token:
            ${{ secrets.GITHUB_TOKEN }}

          action: upload

          app_location: "index.html,3:

          api_location: ''

          output_location: ''

          skip_app_build: true


  close_pull_request:
    if: >
      github.event_name == 'pull_request' &&
      github.event.action == 'closed'

    runs-on: ubuntu-latest

    name: Close Preview Environment

    steps:

      - name: Close Azure Static Web Apps preview
        uses: Azure/static-web-apps-deploy@v1

        with:
          azure_static_web_apps_api_token:
            ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}

          action: close
