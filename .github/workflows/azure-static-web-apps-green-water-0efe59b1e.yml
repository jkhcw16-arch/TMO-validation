name: Deploy TMO site to Azure Static Web Apps

on:
  push:
    branches:
      - main
    paths:
      - "index.html"
      - "site.css"
      - "price.html"
      - "inquiries.html"
      - "privacy.html"
      - "staticwebapp.config.json"
      - ".github/workflows/azure-static-web-apps.yml"

  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: tmo-azure-static-web-app
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy TMO site
    runs-on: ubuntu-latest

    environment:
      name: production

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Verify static site files
        shell: bash
        run: |
          test -f index.html
          test -f site.css

          echo "index.html found"
          echo "site.css found"

      - name: Sign in to Azure with OIDC
        uses: azure/login@v2
        

      - name: Deploy to Azure Static Web Apps
        shell: bash
        env:
          STATIC_WEB_APP_NAME: ${{ vars.AZURE_STATIC_WEB_APP_NAME }}
