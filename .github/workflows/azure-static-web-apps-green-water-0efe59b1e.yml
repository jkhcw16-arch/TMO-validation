name: Deploy TMO site to Azure Static Web Apps

on:
  push:
    branches:
      - main
    paths:
      - "index.html"
      - "site.css"
      - "price.html"
      - "inquiries.html"
      - "privacy.html"
      - "staticwebapp.config.json"
      - ".github/workflows/azure-static-web-apps-green-water-0efe59b1e.yml"

  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: tmo-azure-static-web-app
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy TMO site
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Verify static site
        shell: bash
        run: |
          test -f index.html
          test -f site.css

          echo "index.html found"
          echo "site.css found"

      - name: Sign in to Azure using OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Show Azure account
        shell: bash
        run: |
          az account show --output table

      - name: Deploy TMO site
        shell: bash
        env:
          STATIC_WEB_APP_NAME: ${{ vars.AZURE_STATIC_WEB_APP_NAME }}
          RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
        run: |
          az staticwebapp deploy \
            --name "$STATIC_WEB_APP_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            --source "."
