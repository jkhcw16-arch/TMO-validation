[build-system]
requires=["setuptools>=68"]
build-backend="setuptools.build_meta"

[project]
name="ptm-prime-lattice"
version="0.1.0"
description="Invertible n-dimensional prime-lattice transitions for Pairwise Temporal Memory"
authors = [{ name = "Jamie Kinney" }]
requires-python=">=3.10"
license = { text = "AGPL-3.0-only" }

[tool.pytest.ini_options]
pythonpath=["src"]
